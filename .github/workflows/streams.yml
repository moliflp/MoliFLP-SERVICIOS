name: Actualizar reproducciones

on:
  schedule:
    - cron: "0 6 * * *"   # cada día a las 06:00 UTC
  workflow_dispatch:       # botón "Run workflow" para lanzarlo a mano

permissions:
  contents: write

jobs:
  actualizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node tools/update-streams.mjs
      - name: Guardar si ha cambiado
        run: |
          git config user.name "moliflp-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add streams.json
          git diff --cached --quiet || (git commit -m "Reproducciones actualizadas $(date -u +%F)" && git push)
